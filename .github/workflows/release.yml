name: Release

# Builds Rattle from source and publishes a GitHub release with the zipped app, SHA-256 checksums, an update signature and a
# build-provenance attestation (so anyone can verify the zip came from this repository). The app's built-in updater and
# install.sh both read this release.
#
# Start it from the Actions tab → Release → "Run workflow" and type a version such as 1.2.0. The workflow checks that CI passed
# for the latest commit on the default branch, creates the version tag on that commit, then builds and publishes. (Pushing a v*
# tag yourself runs the build and publish steps on that tag instead.)
#
# One-time setup:
#   • scripts/setup-update-signing.sh makes the Ed25519 update key: the PRIVATE half becomes the repository secret
#     UPDATE_SIGNING_KEY, the PUBLIC half is written into Sources/Rattle/UpdateKey.swift (commit it). The app only installs
#     updates that verify against that key. A release stops before anything is tagged if this has not been done.
#   • Optional, Settings → Environments → "release": add yourself as a required reviewer so every release waits for your click.
#     The same environment can hold RELEASE_SIGNING_KEY / RELEASE_SIGNING_PUBKEY (a passphrase-less ed25519 key pair; add the .pub
#     to your GitHub account as a *signing* key) so the tag is signed and shows "Verified". Without them the tag is unsigned.
#   • Optional: a signing identity, so macOS keeps the Microphone and Accessibility permissions across updates (an ad-hoc signature
#     changes with every build, so each update would ask again):
#       MACOS_CERTIFICATE_P12       base64 of the signing identity exported as .p12
#       MACOS_CERTIFICATE_PASSWORD  password of that .p12
#       MACOS_SIGN_IDENTITY         e.g. "Rattle Local Signing" or "Developer ID Application: Your Name (TEAMID)"
#     With an Apple Developer ID the app is also notarized, so macOS opens it without a warning:
#       APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   Apple ID email, Team ID and an app-specific password

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 1.2.0)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the tag and the release
  id-token: write        # sign the attestation
  attestations: write    # store the attestation
  actions: read          # read the CI result for the commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release           # pauses for approval when reviewers are set, and provides the optional tag-signing secrets
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check the version
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version must look like 1.2.0 (got: $VERSION)"; exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Make sure the version is new, update signing is set up and CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "Tag $TAG already exists"; exit 1; fi
          # Fail before anything is tagged: a release that cannot be signed would be refused by every installed copy.
          if ! grep -Eq 'publicKeyBase64 = "[A-Za-z0-9+/=]{40,}"' Sources/Rattle/UpdateKey.swift; then
            echo "Update signing is not set up. Run scripts/setup-update-signing.sh once, commit Sources/Rattle/UpdateKey.swift, then release again."; exit 1
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "The UPDATE_SIGNING_KEY secret is missing. Run scripts/setup-update-signing.sh."; exit 1; fi
          sha="$(git rev-parse HEAD)"
          echo "Releasing $TAG from $sha"
          result="$(gh run list --workflow ci.yml --commit "$sha" --json conclusion --jq '.[0].conclusion')"
          if [ "$result" != "success" ]; then
            echo "CI has not passed for $sha (result: '${result:-none}'). Wait for it to finish, then run this again."; exit 1
          fi

      - name: Create and push the tag
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_PUBKEY: ${{ secrets.RELEASE_SIGNING_PUBKEY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "Rattle release workflow"
          git config user.email "52958495+${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          if [ -n "$SIGNING_KEY" ] && [ -n "$SIGNING_PUBKEY" ]; then
            umask 077
            mkdir -p "$RUNNER_TEMP/sign"
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/sign/key"
            printf '* %s\n' "$SIGNING_PUBKEY" > "$RUNNER_TEMP/sign/allowed"
            git config gpg.format ssh
            git config user.signingkey "$RUNNER_TEMP/sign/key"
            git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/sign/allowed"
            git tag -s "$TAG" -m "Rattle ${TAG#v}"
            git tag -v "$TAG"
            rm -r "$RUNNER_TEMP/sign"
          else
            echo "No tag-signing key in the release environment; the tag will not be signed."
            git tag -a "$TAG" -m "Rattle ${TAG#v}"
          fi
          git push origin "refs/tags/$TAG"

  build:
    name: Build and publish
    needs: [prepare]
    # run for a pushed tag, or after the prepare job succeeded
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
      HAS_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag || github.ref_name }}
          fetch-depth: 0        # the release notes are written from the commits since the previous tag

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run the tests
        run: swift test

      - name: Import signing identity
        if: env.HAS_IDENTITY == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build universal app
        env:
          RATTLE_UNIVERSAL: "1"
          RATTLE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          RATTLE_HARDENED: ${{ env.HAS_NOTARY == 'true' && '1' || '0' }}
        run: |
          RATTLE_VERSION="${TAG#v}" RATTLE_BUILD="${GITHUB_RUN_NUMBER}" ./scripts/build.sh
          lipo -archs build/Rattle.app/Contents/MacOS/Rattle

      - name: Notarize with Apple
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/Rattle.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/Rattle.app
          spctl --assess --type execute --verbose build/Rattle.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/Rattle.app Rattle.zip
          shasum -a 256 Rattle.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # Every installed copy of Rattle only accepts an update signed with the key in Sources/Rattle/UpdateKey.swift, so a release
          # that is not signed with it would be refused everywhere. Stop here rather than publish one.
          pub="$(sed -n 's/.*publicKeyBase64 = "\(.*\)".*/\1/p' Sources/Rattle/UpdateKey.swift)"
          if [ -z "$pub" ]; then
            echo "Update signing is not set up. Run scripts/setup-update-signing.sh once, commit Sources/Rattle/UpdateKey.swift, then release again."; exit 1
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "The UPDATE_SIGNING_KEY secret is missing. Run scripts/setup-update-signing.sh."; exit 1
          fi
          UPDATE_PUBLIC_KEY="$pub" swift scripts/sign_update.swift Rattle.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Rattle.zip

      - name: Write release notes
        run: python3 .github/scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" Rattle.zip Rattle.zip.sig SHA256SUMS \
            --title "Rattle $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
